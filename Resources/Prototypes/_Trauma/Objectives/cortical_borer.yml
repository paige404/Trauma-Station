- type: entity
  abstract: true
  parent: BaseObjective
  id: BaseCorticalBorerObjective
  components:
  - type: Objective
    difficulty: 1
    issuer: objective-issuer-corticalborer-hive
  - type: RoleRequirement
    roles:
    - CorticalBorerRole

- type: entity
  parent: [BaseCorticalBorerObjective, BaseSurviveObjective]
  id: CorticalBorerHiveEscapeObjective
  description: Escape on the evacuation shuttle to infest CentComm.
  components:
  - type: Objective
    icon:
      sprite: _White/Mobs/Aliens/Xenomorphs/larva.rsi # TODO
      state: xenomorph
  - type: NumberObjective
    min: 3
    max: 10
    title: objective-condition-corticalborer-escape-title
  - type: CorticalBorerHiveEscapeCondition

- type: entity
  parent: BaseCorticalBorerObjective
  id: CorticalBorerEggsObjective
  description: Lay many eggs to expand the hive.
  components:
  - type: Objective
    icon:
      sprite: _Mono/Mobs/Aliens/cortical_borer_egg.rsi
      state: icon
  - type: NumberObjective
    min: 9
    max: 20
    title: objective-condition-corticalborer-eggs-title
  - type: CorticalBorerEggCondition

- type: entity
  parent: BaseCorticalBorerObjective
  id: CorticalBorerInfectedObjective
  description: The hive needs loyal hosts to establish itself in this sector. #TODO
  components:
  - type: Objective
    icon:
      sprite: Structures/Machines/server.rsi # TODO
      state: server
  - type: NumberObjective
    min: 3
    max: 15
    title: objective-condition-corticalborer-infected-title
  - type: CorticalBorerInfectedCondition

- type: entity
  parent: SimpleSpaceMobBase
  id: BaseBrainWorm
  abstract: true
  components:
  - type: Physics
  - type: MobState
  - type: MovementSpeedModifier
    baseWalkSpeed : 2.5
    baseSprintSpeed : 5
  - type: Tag
    tags:
    - Meat
    - CannotSuicide
  - type: ThermalVision
    lightRadius: 15
    activateSound: null
    deactivateSound: null
  - type: CorticalBorer
    eggProto: "CorticalBorerEgg"
    addOnInfest:
    - type: PressureImmunity
    removeOnInfest:
    - type: CanEscapeInventory
    hostDamage:
      types:
        Poison: 0.15
    reagentList:
    - borerBicaridine
    - borerKelotane
    - borerSaline
    - borerEthanol
    - borerMuteToxin
    - borerCharcoal
    - borerHappiness
    - borerEphedrine
    - borerNorepinephricAcid
    - borerDexalinPlus
    externalActions:
    - ActionCorticalBorerInfest
    - ActionCorticalBorerEvolutionMenu
    infestActions:
    - ActionCorticalBorerEject
    - ActionCorticalBorerChemMenu
    - ActionCheckBlood
    - ActionInvadeThoughts
    - ActionControlHost
    - ActionCorticalBorerEvolutionMenu
    controlActions:
    - ActionLayEggHost
    - ActionEndControlHost
  - type: UserInterface
    interfaces:
      enum.CorticalBorerDispenserUiKey.Key:
        type: CorticalBorerDispenserBoundUserInterface
      enum.HealthAnalyzerUiKey.Key:
        type: HealthAnalyzerBoundUserInterface
      enum.StoreUiKey.Key:
        type: StoreBoundUserInterface
  - type: CollectiveMind # Trauma: changed hivemind id for specificity and consistency
    channels:
    - WormMind
    defaultChannel: WormMind
  - type: Speech
    enabled: false
  - type: HealthAnalyzer
    scanningEndSound:
      path: "/Audio/Voice/Slime/slime_squish.ogg"
    maxScanRange: .5
  - type: CanEscapeInventory
  - type: Body
    thermalVisibility: false
  #  - type: UniversalLanguageSpeaker # Trauma: worms only speak the languages of their hosts
  - type: LanguageKnowledge # Trauma: No languages for worms
    speaks: [None]
    understands: [None]
  - type: VentCrawler # Trauma
  - type: StatusEffects
    allowed:
    - Stun
    - SlowedDown
    - Electrocution
    - Pacified
    - RadiationProtection

- type: entity
  name: Cortical Borer
  parent: BaseBrainWorm
  id: MobCorticalBorer
  description: A worm that burrows into brains and lays its eggs
  components:
  - type: GhostRole
    makeSentient: true
    allowSpeech: False
    allowMovement: true
    requirements:
    - !type:OverallPlaytimeRequirement
      time: 36000 # 10 hrs
    name: cortical-borer-ghostrole-name
    description: cortical-borer-ghostrole-desc
    rules: cortical-borer-ghostrole-rules
    mindRoles:
    - MindRoleCorticalBorer
  - type: GhostTakeoverAvailable
  - type: Sprite
    drawdepth: SmallMobs
    sprite: _Mono/Mobs/Aliens/cortical_borer.rsi
    layers:
    - map: [ "enum.DamageStateVisualLayers.Base" ]
      state: cortical_borer
  - type: DamageStateVisuals
    states:
      Alive:
        Base: cortical_borer
      Dead:
        Base: dead
  - type: Item
    size: Tiny
    heldPrefix: 0
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeCircle
          radius: 0.2
        density: 100
        mask:
        - SmallMobMask
        layer:
        - SmallMobLayer
  - type: MobThresholds
    thresholds:
      0: Alive
      20: Dead
  - type: Barotrauma # take away space immunity but still not gasp
    damage:
      types:
        Blunt: 0.15
  - type: Bloodstream
    bloodlossDamage:
      types:
        Bloodloss: 0.5
    bloodlossHealDamage:
      types:
        Bloodloss: -1
    bleedReductionAmount: 2 # bleeding stops faster
#  - type: GuideHelp # TODO
#    guides:
#    - CorticalBorerGuide
  - type: Store
    balance:
      CorticalBorerEvolutionPoint: 200 # TODO 2
    buySuccessSound:
      path: "/Audio/Voice/Slime/slime_squish.ogg"
    categories:
    - CorticalBorerAbilityCategorySymbiosis
    - CorticalBorerAbilityCategoryTenacity
    - CorticalBorerAbilityCategoryDomination
    currencyWhitelist:
    - CorticalBorerEvolutionPoint

- type: entity
  parent: BaseItem
  id: CorticalBorerEgg
  name: cortical borer egg
  description: Within its soft membrane, a worm is maturing. # Trauma: old desc was weird
  components:
  - type: Sprite
    sprite: _Mono/Mobs/Aliens/cortical_borer_egg.rsi
    state: icon
  - type: Item
    size: Tiny
  - type: GhostRole #TODO
    name: cortical-borer-ghostrole-name
    description: cortical-borer-ghostrole-desc
    rules: ghost-role-information-freeagent-rules
    requirements:
    - !type:OverallPlaytimeRequirement
      time: 36000 # 10 hrs
    mindRoles:
    - MindRoleCorticalBorer
#    raffle: TODO uncomment before final PR
#      settings: default
#  - type: GhostRoleMobSpawner
#    prototype: MobCorticalBorer
  - type: Damageable
    damageContainer: Biological
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 1
      behaviors:
      - !type:PlaySoundBehavior
        sound:
          collection: desecration
      - !type:DoActsBehavior
        acts: [ "Destruction" ]
#  - type: GuideHelp # TODO
#    guides:
#    - CorticalBorerGuide
